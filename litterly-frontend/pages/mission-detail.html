<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Details - Litterly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/mission-detail.css" />
    <!-- REQUIRED GLOBAL SCRIPTS -->
    <script
      src="https://kit.fontawesome.com/5f8a667392.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.16.1/dist/axios.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- REQUIRED GLOBAL SCRIPTS -->
  </head>

  <body>
    <div class="page-container">
      <div class="content-container">
        <aside class="sidebar">
          <div class="logo-section">
            <img
              src="../assets/logo-litterly-dark-transparent.png"
              class="logo"
            />
          </div>
          <nav class="wrapper-sidebar-content" aria-label="Main navigation">
            <div class="profile">
              <div class="profile-photo-wrapper">
                <img src="../assets/sample.png" alt="" class="profile-photo" />
              </div>
              <div class="profile-details">
                <section class="full-name" id="username"></section>
                <section class="user-points">
                  <i class="fa-solid fa-leaf"></i>
                  <span id="points">0</span>
                </section>
              </div>
            </div>
            <section class="wrapper-sidebar-items-and-logout">
              <div class="wrapper-sidebar-item">
                <a href="./mission-list.html" class="sidebar-item active">
                  <div class="sidebar-item-icon">
                    <i class="fa-solid fa-list-check"></i>
                  </div>
                  <div class="sidebar-item-text">Missions</div>
                </a>

                <a href="./shop.html" class="sidebar-item">
                  <div class="sidebar-item-icon">
                    <i class="fa-solid fa-shop"></i>
                  </div>
                  <div class="sidebar-item-text">Shop</div>
                </a>
                <a
                  href="./mission-manager-list.html"
                  class="sidebar-item conditional-section"
                  data-role="1"
                >
                  <div class="sidebar-item-icon">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                  </div>
                  <div class="sidebar-item-text">Mission Manager</div>
                </a>
              </div>

              <section class="logout-section">
                <a href="#" class="sidebar-item">
                  <div class="sidebar-item-icon">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                  </div>
                  <div class="sidebar-item-text">Logout</div>
                </a>
              </section>
            </section>
          </nav>
        </aside>

        <main class="main-content-wrapper">
          <div class="content-header">
            <h1 class="header-text">
              <a href="./mission-list.html" class="back-arrow">
                <i class="fa-solid fa-circle-left"></i>
              </a>

              Mission Details
            </h1>
          </div>

          <section class="mission-details-cards-wrapper">
            <section class="mission-detail-cards-left-container">
              <div class="card-thumbnail-wrapper">
                <div class="card-thumbnail-overlay">
                  <div class="overlay-header">
                    <div class="overlay-header-wrapper">
                      <i class="fa-solid fa-star"></i>
                    </div>
                  </div>

                  <div class="overlay-footer">
                    <div class="overlay-footer-wrapper">
                      <div class="overlay-status"></div>
                      <h1 class="overlay-title"></h1>
                    </div>
                  </div>
                </div>
              </div>

              <div class="card-description-wrapper">
                <h2 class="description-title">About This Mission</h2>
              </div>
            </section>

            <section class="mission-detail-cards-right-container">
              <div class="card-extra-details-wrapper">
                <div class="extra-details-wrapper">
                  <h2 class="extra-details-title">Mission Summary</h2>
                  <div class="extra-detail-items">
                    <div class="extra-detail-item">
                      <div class="icon">
                        <i class="fa-solid fa-location-dot"></i>
                      </div>
                      <div class="content">
                        <div class="title">Location</div>
                        <div class="value"></div>
                      </div>
                    </div>
                    <div class="extra-detail-item">
                      <div class="icon">
                        <i class="fa-solid fa-calendar"></i>
                      </div>
                      <div class="content">
                        <div class="title">Date</div>
                        <div class="value"></div>
                      </div>
                    </div>
                    <div class="extra-detail-item">
                      <div class="icon">
                        <i class="fa-solid fa-clock"></i>
                      </div>
                      <div class="content">
                        <div class="title">Time</div>
                        <div class="value"></div>
                      </div>
                    </div>
                    <div class="extra-detail-item reward">
                      <div class="icon">
                        <i class="fa-regular fa-star"></i>
                      </div>
                      <div class="content">
                        <div class="title">Reward</div>
                        <div class="value"></div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="register-button-wrapper"></div>
              </div>
            </section>
          </section>
        </main>
      </div>
    </div>
    <div class="modal-overlay" id="area-modal">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title">Choose Your Area</h2>
          <button class="modal-close" id="modal-close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <p class="modal-subtitle">Select the area you want to clean up</p>
        <div class="modal-areas" id="modal-areas"></div>
      </div>
    </div>
    <script src="../js/utils/notify.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api/authApi.js"></script>
    <script src="../js/api/missionsApi.js"></script>
    <script src="../js/main.js"></script>

    <script src="../js/pages/mission-detail.js"></script>
  </body>
</html>
