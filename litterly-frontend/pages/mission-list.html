<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Board - Litterly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/mission-list.css" />
    <!-- REQUIRED GLOBAL SCRIPTS -->
    <script
      src="https://kit.fontawesome.com/5f8a667392.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.16.1/dist/axios.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <!-- REQUIRED GLOBAL SCRIPTS -->
  </head>

  <body>
    <div class="page-container">
      <div class="content-container">
        <aside class="sidebar">
          <div class="logo-section">
            <img
              src="../assets/img/logo-litterly-dark-transparent.png"
              class="logo"
            />
          </div>
          <nav class="wrapper-sidebar-content" aria-label="Main navigation">
            <div class="profile">
              <div class="profile-photo-wrapper">
                <img
                  src="../assets/img/sample.png"
                  alt=""
                  class="profile-photo"
                />
              </div>
              <div class="profile-details">
                <section class="full-name" id="username"></section>
                <section class="user-points">
                  <i class="fa-solid fa-leaf"></i>
                  <span id="points">0</span>
                </section>
              </div>
            </div>
            <section class="wrapper-sidebar-items-and-logout">
              <div class="wrapper-sidebar-item">
                <a href="./mission-list.html" class="sidebar-item active">
                  <div class="sidebar-item-icon">
                    <i class="fa-solid fa-list-check"></i>
                  </div>
                  <div class="sidebar-item-text">Missions</div>
                </a>

                <a href="./shop.html" class="sidebar-item">
                  <div class="sidebar-item-icon">
                    <i class="fa-solid fa-shop"></i>
                  </div>
                  <div class="sidebar-item-text">Shop</div>
                </a>
                <a
                  href="./mission-manager-list.html"
                  class="sidebar-item conditional-section"
                  data-role="1"
                >
                  <div class="sidebar-item-icon">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                  </div>
                  <div class="sidebar-item-text">Mission Manager</div>
                </a>
              </div>

              <section class="logout-section">
                <a href="#" class="sidebar-item">
                  <div class="sidebar-item-icon">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                  </div>
                  <div class="sidebar-item-text">Logout</div>
                </a>
              </section>
            </section>
          </nav>
        </aside>

        <main class="main-content-wrapper">
          <div class="content-header">
            <h1 class="header-text">missions</h1>
            <div class="header-filter">
              <div class="filterbar-wrapper">
                <a href="./mission-list.html" class="filter-text" data-type=""
                  >All</a
                >
                <a
                  href="./mission-list.html?type=open"
                  class="filter-text"
                  data-type="open"
                  >Open</a
                >
                <a
                  href="./mission-list.html?type=ongoing"
                  class="filter-text"
                  data-type="ongoing"
                  >Ongoing</a
                >
                <a
                  href="./mission-list.html?type=awaiting_rewards"
                  class="filter-text"
                  data-type="awaiting_rewards"
                  >Awaiting Rewards</a
                >
                <a
                  href="./mission-list.html?type=completed"
                  class="filter-text"
                  data-type="completed"
                  >Completed</a
                >
                <a
                  href="./mission-list.html?type=cancelled"
                  class="filter-text"
                  data-type="cancelled"
                  >Cancelled</a
                >
              </div>
              <div
                class="create-mission-btn-wrapper conditional-section"
                data-role="1"
              >
                <a
                  href="#"
                  class="admin-action create-mission conditional-btn"
                  data-role="1"
                  onclick="
                    Modal.open('create-drawer-overlay');
                    return false;
                  "
                >
                  <i class="fa-solid fa-circle-plus"></i>
                </a>
              </div>
            </div>
          </div>
          <section class="cards-wrapper"></section>
        </main>
      </div>
    </div>

    <!-- CREATE DRAWER -->
    <div class="drawer-overlay" id="create-drawer-overlay">
      <div class="drawer" id="create-mission-drawer">
        <div class="drawer-header">
          <h2 class="drawer-title">Create Mission</h2>
          <button
            class="modal-close"
            onclick="Modal.close('create-drawer-overlay')"
          >
            &times;
          </button>
        </div>

        <div class="drawer-body">
          <!-- Photo placeholder -->
          <div class="field-group">
            <label>Mission Photo</label>
            <div class="photo-upload-placeholder">
              <i class="fa-solid fa-image"></i>
              <span>Photo upload coming soon</span>
            </div>
          </div>

          <div class="field-group">
            <label for="mission-title"
              >Title <span class="required">*</span></label
            >
            <input type="text" id="mission-title" placeholder="Mission title" />
          </div>

          <div class="field-group">
            <label for="mission-desc"
              >Description <span class="required">*</span></label
            >
            <textarea
              id="mission-desc"
              placeholder="What is this mission about?"
            ></textarea>
          </div>

          <div class="field-group">
            <label for="mission-location"
              >Location <span class="required">*</span></label
            >
            <input
              type="text"
              id="mission-location"
              placeholder="e.g. Waterkant 2, Paramaribo"
            />
          </div>

          <div class="field-group">
            <label for="mission-date">
              Mission Date <span class="required">*</span>
            </label>
            <input type="date" id="mission-date" />
          </div>

          <div class="field-row">
            <div class="field-group">
              <label for="mission-start-time">
                Start Time <span class="required">*</span>
              </label>
              <input type="time" id="mission-start-time" />
            </div>

            <div class="field-group">
              <label for="mission-end-time">
                End Time <span class="required">*</span>
              </label>
              <input type="time" id="mission-end-time" />
            </div>
          </div>

          <div class="field-group">
            <label for="mission-max-participants"
              >Max Participants
              <span class="field-hint">(leave empty for unlimited)</span></label
            >
            <input
              type="number"
              id="mission-max-participants"
              placeholder="Unlimited"
              min="1"
            />
          </div>

          <!-- Areas section -->
          <div class="areas-section">
            <div class="areas-section-header">
              <label>Mission Areas <span class="required">*</span></label>
              <button class="btn-add-area" onclick="Modal.addArea()">
                <i class="fa-solid fa-plus"></i> Add Area
              </button>
            </div>
            <div class="areas-list" id="create-areas-list">
              <!-- areas added dynamically -->
            </div>
            <p class="area-hint">At least one area is required.</p>
          </div>
        </div>

        <div class="drawer-footer">
          <button
            class="btn-cancel"
            onclick="Modal.close('create-drawer-overlay')"
          >
            Cancel
          </button>
          <button class="btn-demo" onclick="Modal.autofillDemo()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Demo
          </button>
          <button
            class="btn-submit"
            onclick="Modal.submit('create-mission-drawer')"
          >
            Create Mission
          </button>
        </div>
      </div>
    </div>

    <!-- DELETE CONFIRMATION MODAL -->
    <div class="modal-overlay" id="delete-modal-overlay">
      <div class="confirm-delete-modal" id="delete-mission-modal">
        <button
          class="modal-close"
          onclick="Modal.close('delete-modal-overlay')"
          aria-label="Close modal"
        >
          &times;
        </button>

        <div class="confirm-delete-icon-wrapper">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <div class="confirm-delete-text">
          <h2 class="modal-title">Delete mission?</h2>
          <p class="confirm-delete-subtitle">
            You're about to delete
            <strong id="delete-mission-name">"Mission Title"</strong>. This
            action cannot be undone.
          </p>
        </div>

        <div class="modal-footer">
          <button
            class="btn-cancel"
            onclick="Modal.close('delete-modal-overlay')"
          >
            Cancel
          </button>
          <button class="btn-delete" id="btn-confirm-delete">
            Delete mission
          </button>
        </div>
      </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal-overlay" id="edit-modal-overlay">
      <div class="creating-mission" id="edit-mission-modal">
        <button
          class="modal-close"
          onclick="Modal.close('edit-modal-overlay')"
          aria-label="Close modal"
        >
          &times;
        </button>
        <h2 class="modal-title">Edit mission</h2>

        <div class="field-group">
          <label for="edit-mission-title">Title</label>
          <input
            type="text"
            id="edit-mission-title"
            placeholder="Mission title"
          />
        </div>
        <div class="field-group">
          <label for="edit-mission-desc">Description</label>
          <textarea
            id="edit-mission-desc"
            placeholder="What is this mission about?"
          ></textarea>
        </div>

        <div class="modal-footer">
          <button
            class="btn-cancel"
            onclick="Modal.close('edit-modal-overlay')"
          >
            Cancel
          </button>
          <button
            class="btn-submit"
            onclick="Modal.submitEdit('edit-mission-modal')"
          >
            Save changes
          </button>
        </div>
      </div>
    </div>

    <script src="../js/utils/notify.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api/authApi.js"></script>
    <script src="../js/api/missionsApi.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/utils/demoData.js"></script>
    <script src="../js/utils/modal.js"></script>
    <script src="../js/pages/missions.js"></script>
  </body>
</html>
