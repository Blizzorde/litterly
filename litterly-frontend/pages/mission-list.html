<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Board - Litterly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/mission-list.css" />
  <script
    src="https://kit.fontawesome.com/5f8a667392.js"
    crossorigin="anonymous">
  </script>
</head>

<body>
  <div class="page-container">
    <div class="content-container">
      <aside class="sidebar">
        <div class="logo-section">
          <img src="../assets/logo-litterly-dark-transparent.png" class="logo">
        </div>
        <nav class="wrapper-sidebar-content" aria-label="Main navigation">
    
            <div class="profile">
              <div class="profile-photo-wrapper">
                <img src="../assets/sample.png" alt="" class="profile-photo">
              </div>
              <div class="profile-details">
                <section class="full-name">
                    full-name
                </section>
                <section class="user-points">
                  <i class="fa-solid fa-leaf"></i>
                    user-points
                </section>
              </div>
            </div>
  
            <section class="wrapper-sidebar-items-and-logout">
  
              <div class="wrapper-sidebar-item">
                <div class="sidebar-item">
                  <div class="sidebar-item-icon">
                    <i class="fa-solid fa-circle"></i>
                  </div>
                  <div class="sidebar-item-text">
                    missions
                  </div>
                </div>
                <div class="sidebar-item">
                  <div class="sidebar-item-icon">
                    <i class="fa-solid fa-circle"></i>
                  </div>
                  <div class="sidebar-item-text">
                    my missions
                  </div>
                </div>
                <div class="sidebar-item">
                  <div class="sidebar-item-icon">
                    <i class="fa-solid fa-circle"></i>
                  </div>
                  <div class="sidebar-item-text">
                    shop
                  </div>
                </div>
              </div>
              
              <section class="logout-section">
                  <div class="sidebar-item">
                    <div class="sidebar-item-icon">
                      <i class="fa-solid fa-circle"></i>
                    </div>
                    <div class="sidebar-item-text">
                      logout
                    </div>
                  </section>
  
            </section>
            
          </nav>
      </aside>

      <main class="main-content-wrapper">
        <div class="content-header">
          <div class="header-text">
            headertext
          </div>
          <div class="header-filter">
            <div class="filterbar-wrapper">
              <div class="filter-text">
                All mission
              </div>
              <div class="filter-text">
                Active
              </div>
              <div class="filter-text">
                Ongoing
              </div>
              <div class="filter-text">
                Completed
              </div>
            </div>
          </div>
        </div>
        <section class="card-wrapper">
          <div class="card-content-container">
            card 1
            <div class="card-text-content-wrapper">
              
            </div>
            <div class="card-thumbnail-wrapper">
              
            </div>

            <div class="card-button-wrapper">

            </div>
          </div>
          <div class="card-content-container">
            card 2
          </div>
          <div class="card-content-container">
            card 3
          </div>

        </section>
      </main>
    </div>
  </div>


  <script src="js/main.js"></script>
</body>

</html>
