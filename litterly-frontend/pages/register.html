<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Litterly | Register</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/user-missions.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <div class="brand-name">Litterly</div>
        <nav class="page-nav">
          <a href="login.html">Login</a>
          <a href="../index.html">Missions</a>
        </nav>
      </header>
      <main class="page-main">
        <section class="page-hero">
          <p class="eyebrow">Create account</p>
          <h1>Join Litterly</h1>
          <p class="page-description">Register to join available cleanup missions and earn rewards.</p>
        </section>

        <section class="detail-card">
          <form id="register-form" class="auth-form">
            <div class="form-group">
              <label for="register-email">Email</label>
              <input id="register-email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
              <label for="register-password">Password</label>
              <input id="register-password" type="password" placeholder="••••••••" required />
            </div>
            <div class="card-actions">
              <button type="submit" class="btn-primary">Register</button>
              <a href="login.html" class="btn-outline">Already have an account</a>
            </div>
          </form>
        </section>
      </main>
    </div>

    <div id="toast-container"></div>
    <script type="module" src="../js/pages/register.js"></script>
  </body>
</html>
